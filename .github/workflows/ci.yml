name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS host build and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The image's default Xcode 16 ships Swift 6.1; the package wants 6.2 (Examples/
      # LibraryCompat's dependencies declare tools version 6.2).
      - name: Select the newest Xcode 26
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
          xcode-select -p
      - run: swift --version
      - run: swift build
      - name: Build every example
        shell: bash
        run: for p in HelloWindow Calculator FramelessWindow Animation Drawing Observable AudioPlayer TextEdit Toolbar Sheets; do swift build --product $p; done
      - name: Drawing example headless PNG export
        run: .build/debug/Drawing --export drawing-macos.png
      - name: TextEdit example headless document round trip (NSDocumentController, RTF)
        run: .build/debug/TextEdit --roundtrip textedit-macos.rtf
      - name: TextEdit example RTFD round trip (a list, a table and an attachment)
        run: .build/debug/TextEdit --roundtrip-rtfd textedit-macos.rtfd
      - name: AudioPlayer example offline render (Apple's AVFoundation)
        run: .build/debug/AudioPlayer --render audio-macos.wav && ls -la audio-macos.wav
      - run: swift test
      - name: Third-party SwiftUI library compatibility example
        run: tools/library-compat.sh
      - name: Audio engine tests against the port's AVFAudio (ADR-0014)
        run: APPKITWIN_HOST_AVFAUDIO=1 swift test --filter AudioTests

  windows:
    name: Windows build and tests
    # windows-latest ships VS 2026 (MSVC 14.5x), whose STL needs Clang 20; Swift 6.2's clang is older.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE
      - run: swift --version
      # One job at a time (-j 1) on every Windows build and test: Swift 6.2's driver, when
      # two of its jobs start together, now and then loses one whose response file or
      # launch throws. MultiJobExecutor drops the error, the other jobs finish and the
      # build exits 1 with nothing said, usually at AppKit's emit-module job
      # (docs/ci-windows-runner.md). -no-emit-module-separately breaks SwiftUI's
      # merge-modules step (opaque result types), and -driver-force-response-files only
      # moved the failure to other modules.
      - name: Build
        shell: bash
        run: swift build -c debug -j 1
      - name: Build every example
        shell: bash
        run: for p in HelloWindow Calculator FramelessWindow Animation Drawing Observable AudioPlayer TextEdit Toolbar Sheets; do swift build -j 1 --product $p; done
      - name: AudioPlayer example offline render (WASAPI absent on the runner)
        run: .build/debug/AudioPlayer.exe --render audio-windows.wav
      - name: TextEdit example headless document round trip
        run: .build/debug/TextEdit.exe --roundtrip textedit-windows.rtf
        env:
          APPKITWIN_HOST_BACKEND: "1"
      - name: TextEdit example RTFD round trip (a list, a table and an attachment)
        run: .build/debug/TextEdit.exe --roundtrip-rtfd textedit-windows.rtfd
        env:
          APPKITWIN_HOST_BACKEND: "1"
      - name: Tests on the host backend
        shell: bash
        run: swift test -j 1
        env:
          APPKITWIN_HOST_BACKEND: "1"
          # The Direct3D 12 shim's log (device, shader compiler, swap-chain and readback
          # failures with HRESULTs) on stderr, without the debug layer.
          APPKITWIN_D3D12_LOG: "1"
      - name: Third-party SwiftUI library compatibility example
        run: bash tools/library-compat.sh

  linux:
    name: Linux build (X11 + Wayland, Cairo)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install packages (Azure Ubuntu mirror, with retries)
        run: tools/ci/apt-install.sh pkg-config libcairo2-dev libpango1.0-dev libx11-dev libxi-dev libwayland-dev libxkbcommon-dev libdbus-1-dev libpipewire-0.3-dev libasound2-dev libhunspell-1.7-0 hunspell-en-us
      - run: swift build
      - name: Build every example
        shell: bash
        run: for p in HelloWindow Calculator FramelessWindow Animation Drawing Observable AudioPlayer TextEdit Toolbar Sheets; do swift build --product $p; done
      - name: Drawing example headless PNG export on the host backend
        run: APPKITWIN_HOST_BACKEND=1 .build/debug/Drawing --export drawing-linux.png
      - name: TextEdit example headless document round trip on the host backend
        run: APPKITWIN_HOST_BACKEND=1 .build/debug/TextEdit --roundtrip textedit-linux.rtf
      - name: TextEdit example RTFD round trip (a list, a table and an attachment)
        run: APPKITWIN_HOST_BACKEND=1 .build/debug/TextEdit --roundtrip-rtfd textedit-linux.rtfd
      - name: AudioPlayer example offline render (no sound device on the runner)
        run: APPKITWIN_HOST_BACKEND=1 .build/debug/AudioPlayer --render audio-linux.wav && ls -la audio-linux.wav
      - name: Tests on the host backend
        run: APPKITWIN_HOST_BACKEND=1 swift test
      - name: Third-party SwiftUI library compatibility example
        run: tools/library-compat.sh

  linux-vulkan:
    name: Linux build and tests on lavapipe (Vulkan backend, ADR-0012)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install packages (Azure Ubuntu mirror, with retries)
        run: tools/ci/apt-install.sh pkg-config libcairo2-dev libpango1.0-dev libx11-dev libxi-dev libwayland-dev libxkbcommon-dev libdbus-1-dev libvulkan-dev libvulkan1 mesa-vulkan-drivers vulkan-validationlayers glslang-tools libpipewire-0.3-dev libasound2-dev xvfb
      - run: swift build
      - name: Build every example
        shell: bash
        run: for p in HelloWindow Calculator FramelessWindow Animation Drawing Observable AudioPlayer TextEdit Toolbar Sheets; do swift build --product $p; done
      - name: Tests on the host backend with the validation layer
        run: APPKITWIN_HOST_BACKEND=1 APPKITWIN_VULKAN_DEBUG=1 swift test
      - name: Metal self-test on the Vulkan device
        run: APPKITWIN_VULKAN_DEBUG=1 .build/debug/HelloWindow --metal-selftest
      - name: Swap-chain presentation tests on the X11 backend under Xvfb (lavapipe presents to a child window)
        run: xvfb-run -a -s "-screen 0 1280x800x24" env APPKITWIN_LINUX_BACKEND=x11 APPKITWIN_VULKAN_DEBUG=1 swift test --filter MetalVulkanPresentationTests
      - name: HelloWindow Metal tab presents through the swap chain under Xvfb
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" env APPKITWIN_LINUX_BACKEND=x11 timeout 8 .build/debug/HelloWindow --metal --metal-log --metal-static > metal.log 2>&1 || true
          grep -E "^device|Vulkan|pipeline failed|^frame" metal.log | head -5
          grep -q "presentation=swap chain" metal.log
