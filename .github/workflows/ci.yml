name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS host build and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The image's default Xcode 16 ships Swift 6.1; the package wants 6.2 (Examples/
      # LibraryCompat's dependencies declare tools version 6.2).
      - name: Select the newest Xcode 26
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
          xcode-select -p
      - run: swift --version
      - run: swift build
      - name: Build every example
        shell: bash
        run: for p in HelloWindow Calculator FramelessWindow Animation Drawing Observable AudioPlayer Sheets; do swift build --product $p; done
      - name: Drawing example headless PNG export
        run: .build/debug/Drawing --export drawing-macos.png
      - name: AudioPlayer example offline render (Apple's AVFoundation)
        run: .build/debug/AudioPlayer --render audio-macos.wav && ls -la audio-macos.wav
      - run: swift test
      - name: Third-party SwiftUI library compatibility example
        run: tools/library-compat.sh
      - name: Audio engine tests against the port's AVFAudio (ADR-0014)
        run: APPKITWIN_HOST_AVFAUDIO=1 swift test --filter AudioTests

  windows:
    name: Windows build and tests
    # windows-latest ships VS 2026 (MSVC 14.5x), whose STL needs Clang 20; Swift 6.2's clang is older.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE
      - run: swift --version
      - name: Runner resources
        shell: bash
        run: |
          powershell -NoProfile -Command "Get-CimInstance Win32_OperatingSystem | Select-Object FreePhysicalMemory,TotalVisibleMemorySize,FreeVirtualMemory,TotalVirtualMemorySize | Format-List"
          powershell -NoProfile -Command "Get-CimInstance Win32_PageFileUsage | Select-Object Name,AllocatedBaseSize,CurrentUsage | Format-List"
          df -h C: D: || true
          nproc || true
      # Two compiler jobs at a time, and one retry: the runner kills a frontend mid-compile
      # now and then (the log ends in warning notes, no diagnostic, exit code 1), in the
      # root build as well as in the library-compat step. The retry resumes the
      # incremental build; the resource dump says what the runner looked like when it died.
      - name: Build (two compiler jobs, one retry)
        shell: bash
        run: |
          set -o pipefail
          build() { swift build -c debug -j 2 2>&1 | tr -d '\r' | tee build.log; }
          if ! build; then
            echo "== swift build failed: runner resources at that point"
            powershell -NoProfile -Command "Get-CimInstance Win32_OperatingSystem | Select-Object FreePhysicalMemory,TotalVisibleMemorySize,FreeVirtualMemory,TotalVirtualMemorySize | Format-List"
            df -h C: D: || true
            echo "== lines that are not warnings"
            grep -aE "error|Assertion|Stack dump|exception|signal|killed" build.log | grep -avE "warning:|^\s*\||^\s*[0-9]+ \||Swift 6 language|SendableClosure" | head -20 || true
            echo "== retrying once"
            build
          fi
      - name: Build every example
        shell: bash
        run: for p in HelloWindow Calculator FramelessWindow Animation Drawing Observable AudioPlayer Sheets; do swift build -j 2 --product $p; done
      - name: AudioPlayer example offline render (WASAPI absent on the runner)
        run: .build/debug/AudioPlayer.exe --render audio-windows.wav
      - name: Tests on the host backend
        run: swift test -j 2
        env:
          APPKITWIN_HOST_BACKEND: "1"
          # The Direct3D 12 shim's log (device, shader compiler, swap-chain and readback
          # failures with HRESULTs) on stderr, without the debug layer.
          APPKITWIN_D3D12_LOG: "1"
      - name: Third-party SwiftUI library compatibility example
        run: bash tools/library-compat.sh

  linux:
    name: Linux build (X11 + Wayland, Cairo)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends pkg-config libcairo2-dev libpango1.0-dev libx11-dev libxi-dev libwayland-dev libxkbcommon-dev libdbus-1-dev libpipewire-0.3-dev libasound2-dev
      - run: swift build
      - name: Build every example
        shell: bash
        run: for p in HelloWindow Calculator FramelessWindow Animation Drawing Observable AudioPlayer Sheets; do swift build --product $p; done
      - name: Drawing example headless PNG export on the host backend
        run: APPKITWIN_HOST_BACKEND=1 .build/debug/Drawing --export drawing-linux.png
      - name: AudioPlayer example offline render (no sound device on the runner)
        run: APPKITWIN_HOST_BACKEND=1 .build/debug/AudioPlayer --render audio-linux.wav && ls -la audio-linux.wav
      - name: Tests on the host backend
        run: APPKITWIN_HOST_BACKEND=1 swift test
      - name: Third-party SwiftUI library compatibility example
        run: tools/library-compat.sh

  linux-vulkan:
    name: Linux build and tests on lavapipe (Vulkan backend, ADR-0012)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends pkg-config libcairo2-dev libpango1.0-dev libx11-dev libxi-dev libwayland-dev libxkbcommon-dev libdbus-1-dev libvulkan-dev libvulkan1 mesa-vulkan-drivers vulkan-validationlayers glslang-tools libpipewire-0.3-dev libasound2-dev xvfb
      - run: swift build
      - name: Build every example
        shell: bash
        run: for p in HelloWindow Calculator FramelessWindow Animation Drawing Observable AudioPlayer Sheets; do swift build --product $p; done
      - name: Tests on the host backend with the validation layer
        run: APPKITWIN_HOST_BACKEND=1 APPKITWIN_VULKAN_DEBUG=1 swift test
      - name: Metal self-test on the Vulkan device
        run: APPKITWIN_VULKAN_DEBUG=1 .build/debug/HelloWindow --metal-selftest
      - name: Swap-chain presentation tests on the X11 backend under Xvfb (lavapipe presents to a child window)
        run: xvfb-run -a -s "-screen 0 1280x800x24" env APPKITWIN_LINUX_BACKEND=x11 APPKITWIN_VULKAN_DEBUG=1 swift test --filter MetalVulkanPresentationTests
      - name: HelloWindow Metal tab presents through the swap chain under Xvfb
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" env APPKITWIN_LINUX_BACKEND=x11 timeout 8 .build/debug/HelloWindow --metal --metal-log --metal-static > metal.log 2>&1 || true
          grep -E "^device|Vulkan|pipeline failed|^frame" metal.log | head -5
          grep -q "presentation=swap chain" metal.log
