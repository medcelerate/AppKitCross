name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS host build and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The image's default Xcode 16 ships Swift 6.1; the package wants 6.2 (Examples/
      # LibraryCompat's dependencies declare tools version 6.2).
      - name: Select the newest Xcode 26
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
          xcode-select -p
      - run: swift --version
      - run: swift build
      - name: Build every example
        shell: bash
        run: for p in HelloWindow Calculator FramelessWindow Animation Drawing Observable AudioPlayer TextEdit Toolbar Sheets Workspace DailyTodo DailyTodoChecks MDVault; do swift build --product $p; done
      - name: Drawing example headless PNG export
        run: .build/debug/Drawing --export drawing-macos.png
      - name: Daily To Do (a vendored third-party SwiftUI app) runs its own self-checks
        run: .build/debug/DailyTodoChecks
      - name: TextEdit example headless document round trip (NSDocumentController, RTF)
        run: .build/debug/TextEdit --roundtrip textedit-macos.rtf
      - name: TextEdit example RTFD round trip (a list, a table and an attachment)
        run: .build/debug/TextEdit --roundtrip-rtfd textedit-macos.rtfd
      - name: TextEdit paste self-test (paste an image, save as RTFD, reopen)
        run: APPKITWIN_TRACE_PASTEBOARD=1 .build/debug/TextEdit --paste-selftest
      - name: TextEdit example prints to PDF (ADR-0022, Apple's PDF writer)
        run: .build/debug/TextEdit --print-pdf textedit-macos.pdf
      - name: AudioPlayer example offline render (Apple's AVFoundation)
        run: .build/debug/AudioPlayer --render audio-macos.wav && ls -la audio-macos.wav
      - run: swift test
      - name: Third-party SwiftUI library compatibility example
        run: tools/library-compat.sh
      - name: Audio engine tests against the port's AVFAudio (ADR-0014)
        run: APPKITWIN_HOST_AVFAUDIO=1 swift test --filter AudioTests

  windows:
    name: Windows build and tests
    # windows-latest ships VS 2026 (MSVC 14.5x), whose STL needs Clang 20; Swift 6.2's clang is older.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE
      - run: swift --version
      # One job at a time (-j 1) on every Windows build and test: Swift 6.2's driver, when
      # two of its jobs start together, now and then loses one whose response file or
      # launch throws. MultiJobExecutor drops the error, the other jobs finish and the
      # build exits 1 with nothing said, usually at AppKit's emit-module job
      # (docs/ci-windows-runner.md). -no-emit-module-separately breaks SwiftUI's
      # merge-modules step (opaque result types), and -driver-force-response-files only
      # moved the failure to other modules.
      - name: Build
        shell: bash
        run: swift build -c debug -j 1
      - name: Build every example
        shell: bash
        run: for p in HelloWindow Calculator FramelessWindow Animation Drawing Observable AudioPlayer TextEdit Toolbar Sheets Workspace DailyTodo DailyTodoChecks MDVault; do swift build -j 1 --product $p; done
      # The Win32 backend, not the host one: a URL opened through a stub scheme handler
      # (Notepad), then the window, the WinEvent hooks and the poll timer run for five
      # seconds while the handler launches and comes to the front (ADR-0026). A crash in a
      # hook or in the shell's re-entrant pump shows up as a non-zero exit.
      - name: Workspace example opens a URL through a stub handler and stays alive
        shell: pwsh
        run: |
          reg add "HKCU\Software\Classes\appkitcross-test" /ve /d "URL:AppKitCross test" /f | Out-Null
          reg add "HKCU\Software\Classes\appkitcross-test" /v "URL Protocol" /t REG_SZ /f | Out-Null
          reg add "HKCU\Software\Classes\appkitcross-test\shell\open\command" /ve /d '"C:\Windows\System32\notepad.exe" "%1"' /f | Out-Null
          $log = & .build/debug/Workspace.exe --open appkitcross-test://ci --stay 5 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $log
          taskkill /F /IM notepad.exe 2>$null | Out-Null
          reg delete "HKCU\Software\Classes\appkitcross-test" /f | Out-Null
          if ($code -ne 0) { Write-Error "Workspace.exe exited with $code"; exit 1 }
          if ($log -notmatch 'open appkitcross-test://ci: true') { Write-Error "the URL was not opened"; exit 1 }
          if ($log -notmatch 'alive after 5') { Write-Error "the example did not reach the 5 s mark"; exit 1 }
      - name: AudioPlayer example offline render (WASAPI absent on the runner)
        run: .build/debug/AudioPlayer.exe --render audio-windows.wav
      - name: TextEdit example headless document round trip
        run: .build/debug/TextEdit.exe --roundtrip textedit-windows.rtf
        env:
          APPKITWIN_HOST_BACKEND: "1"
      - name: TextEdit example RTFD round trip (a list, a table and an attachment)
        run: .build/debug/TextEdit.exe --roundtrip-rtfd textedit-windows.rtfd
        env:
          APPKITWIN_HOST_BACKEND: "1"
      - name: TextEdit paste self-test (paste an image, save as RTFD, reopen)
        run: .build/debug/TextEdit.exe --paste-selftest
        env:
          APPKITWIN_HOST_BACKEND: "1"
          APPKITWIN_TRACE_PASTEBOARD: "1"
      - name: TextEdit example prints to PDF (ADR-0022, the recording CGContext and the PDF writer)
        run: .build/debug/TextEdit.exe --print-pdf textedit-windows.pdf
        env:
          APPKITWIN_HOST_BACKEND: "1"
      - name: Tests on the host backend
        shell: bash
        run: swift test -j 1
        env:
          APPKITWIN_HOST_BACKEND: "1"
          # The Direct3D 12 shim's log (device, shader compiler, swap-chain and readback
          # failures with HRESULTs) on stderr, without the debug layer.
          APPKITWIN_D3D12_LOG: "1"
      - name: Third-party SwiftUI library compatibility example
        run: bash tools/library-compat.sh

  linux:
    name: Linux build (X11 + Wayland, Cairo)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install packages (Azure Ubuntu mirror, with retries)
        run: tools/ci/apt-install.sh pkg-config libcairo2-dev libpango1.0-dev libx11-dev libxi-dev libwayland-dev libxkbcommon-dev libdbus-1-dev libpipewire-0.3-dev libasound2-dev libhunspell-1.7-0 hunspell-en-us dbus
      - run: swift build
      - name: Build every example
        shell: bash
        run: for p in HelloWindow Calculator FramelessWindow Animation Drawing Observable AudioPlayer TextEdit Toolbar Sheets Workspace DailyTodo DailyTodoChecks MDVault; do swift build --product $p; done
      - name: Drawing example headless PNG export on the host backend
        run: APPKITWIN_HOST_BACKEND=1 .build/debug/Drawing --export drawing-linux.png
      - name: Daily To Do (a vendored third-party SwiftUI app) runs its own self-checks
        run: .build/debug/DailyTodoChecks
      - name: TextEdit example headless document round trip on the host backend
        run: APPKITWIN_HOST_BACKEND=1 .build/debug/TextEdit --roundtrip textedit-linux.rtf
      - name: TextEdit example RTFD round trip (a list, a table and an attachment)
        run: APPKITWIN_HOST_BACKEND=1 .build/debug/TextEdit --roundtrip-rtfd textedit-linux.rtfd
      - name: TextEdit paste self-test (paste an image, save as RTFD, reopen)
        run: APPKITWIN_HOST_BACKEND=1 APPKITWIN_TRACE_PASTEBOARD=1 .build/debug/TextEdit --paste-selftest
      - name: TextEdit example prints to PDF (ADR-0022, Cairo's PDF surface)
        run: APPKITWIN_HOST_BACKEND=1 .build/debug/TextEdit --print-pdf textedit-linux.pdf
      - name: AudioPlayer example offline render (no sound device on the runner)
        run: APPKITWIN_HOST_BACKEND=1 .build/debug/AudioPlayer --render audio-linux.wav && ls -la audio-linux.wav
      - name: Tests on the host backend
        run: APPKITWIN_HOST_BACKEND=1 swift test
      - name: Linux notifications against a fake notification server on a private session bus (ADR-0043)
        run: dbus-run-session -- swift test --filter FreedesktopNotifierTests
      - name: Third-party SwiftUI library compatibility example
        run: tools/library-compat.sh

  linux-vulkan:
    name: Linux build and tests on lavapipe (Vulkan backend, ADR-0012)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install packages (Azure Ubuntu mirror, with retries)
        run: tools/ci/apt-install.sh pkg-config libcairo2-dev libpango1.0-dev libx11-dev libxi-dev libwayland-dev libxkbcommon-dev libdbus-1-dev libvulkan-dev libvulkan1 mesa-vulkan-drivers vulkan-validationlayers glslang-tools libpipewire-0.3-dev libasound2-dev xvfb
      - run: swift build
      - name: Build every example
        shell: bash
        run: for p in HelloWindow Calculator FramelessWindow Animation Drawing Observable AudioPlayer TextEdit Toolbar Sheets Workspace DailyTodo DailyTodoChecks MDVault; do swift build --product $p; done
      - name: Tests on the host backend with the validation layer
        run: APPKITWIN_HOST_BACKEND=1 APPKITWIN_VULKAN_DEBUG=1 swift test
      - name: Metal self-test on the Vulkan device
        run: APPKITWIN_VULKAN_DEBUG=1 .build/debug/HelloWindow --metal-selftest
      - name: Metal self-test presents a frame through the swap chain under Xvfb (ADR-0042)
        run: xvfb-run -a -s "-screen 0 1280x800x24" env APPKITWIN_LINUX_BACKEND=x11 APPKITWIN_VULKAN_DEBUG=1 timeout 60 .build/debug/HelloWindow --metal-selftest
      - name: Swap-chain presentation tests on the X11 backend under Xvfb (lavapipe presents to a child window)
        run: xvfb-run -a -s "-screen 0 1280x800x24" env APPKITWIN_LINUX_BACKEND=x11 APPKITWIN_VULKAN_DEBUG=1 swift test --filter MetalVulkanPresentationTests
      - name: HelloWindow Metal tab presents through the swap chain under Xvfb
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" env APPKITWIN_LINUX_BACKEND=x11 timeout 8 .build/debug/HelloWindow --metal --metal-log --metal-static > metal.log 2>&1 || true
          grep -E "^device|Vulkan|pipeline failed|^frame" metal.log | head -5
          grep -q "presentation=swap chain" metal.log

  # Shipping (ADR-0046): the release configuration, a dependent package built with a plain
  # `swift build`, the app folders `swift package bundle` lays out, and the crash report path.
  # Separate jobs so the release builds run beside the debug ones instead of after them.
  macos-release:
    name: macOS release build, tests and dependent package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode 26
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
      - run: swift build -c release
      - name: Tests in release
        run: swift test -c release
      - name: A dependent package (Examples/Dependent) with a plain swift build
        working-directory: Examples/Dependent
        run: swift build
      - name: Bundle MDVault (the host layout check)
        run: swift package --allow-writing-to-package-directory bundle --product MDVault -c release --zip && ls -R .build/bundle | head -20

  linux-release:
    name: Linux release build, tests, bundles and crash report
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install packages (Azure Ubuntu mirror, with retries)
        run: tools/ci/apt-install.sh pkg-config libcairo2-dev libpango1.0-dev libx11-dev libxi-dev libwayland-dev libxkbcommon-dev libdbus-1-dev libpipewire-0.3-dev libasound2-dev libhunspell-1.7-0 hunspell-en-us dbus patchelf zip
      - run: swift build -c release
      - name: Tests in release on the host backend
        run: APPKITWIN_HOST_BACKEND=1 swift test -c release
      - name: A dependent package (Examples/Dependent) with a plain swift build
        working-directory: Examples/Dependent
        run: swift build
      - name: Bundle the dependent package through the plugin it gets from AppKitCross
        working-directory: Examples/Dependent
        run: swift package --allow-writing-to-package-directory bundle --product Dependent -c release --zip
      - name: Bundle MDVault and DailyTodo
        run: |
          swift package --allow-writing-to-package-directory bundle --product MDVault -c release --zip
          swift package --allow-writing-to-package-directory bundle --product DailyTodo -c release --zip
          ls -la .build/bundle .build/bundle/MDVault
      - name: The bundles run with the Swift toolchain moved away (and crash into a report)
        shell: bash
        run: |
          set -x
          mv /usr/lib/swift/linux /usr/lib/swift/linux.hidden
          trap 'mv /usr/lib/swift/linux.hidden /usr/lib/swift/linux' EXIT
          ! ldd Examples/Dependent/.build/bundle/Dependent/Dependent | grep "not found"
          ! ldd .build/bundle/MDVault/MDVault | grep "not found"
          # MDVault keeps running on the headless backend: still alive after 5 s means it launched.
          status=0; APPKITWIN_HOST_BACKEND=1 timeout 5 .build/bundle/MDVault/MDVault || status=$?
          test "$status" = 124
          status=0; APPKITWIN_HOST_BACKEND=1 timeout 5 .build/bundle/DailyTodo/DailyTodo || status=$?
          test "$status" = 124
          # APPKITWIN_CRASH_TEST: a segfault a second after launch leaves a report under
          # $XDG_DATA_HOME/<bundle id>/Crashes.
          export XDG_DATA_HOME=$PWD/xdg
          status=0; APPKITWIN_HOST_BACKEND=1 APPKITWIN_CRASH_TEST=1 timeout 30 Examples/Dependent/.build/bundle/Dependent/Dependent || status=$?
          test "$status" = 139
          report=$(ls xdg/Dependent/Crashes/*.txt | head -1)
          head -40 "$report"
          grep -q "SIGSEGV" "$report"
          grep -q "Backtrace" "$report"
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-linux
          path: |
            .build/bundle/*.zip
            Examples/Dependent/.build/bundle/*.zip
          retention-days: 14

  linux-bundle-clean:
    name: Linux bundles on Ubuntu without Swift or Cairo
    needs: linux-release
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundles-linux
          path: bundles
      # Only what LibraryPolicy leaves to the system: glibc and libstdc++, X11/xcb, Wayland,
      # xkbcommon, fonts, D-Bus, and PipeWire's client library (linked through its pkg-config
      # entry although the audio shim dlopens it). No Swift, no Cairo, no Pango, no GLib.
      - name: Install the desktop base libraries (Azure Ubuntu mirror, with retries)
        run: tools/ci/apt-install.sh unzip libx11-6 libxcb1 libxcb-render0 libxcb-shm0 libwayland-client0 libwayland-cursor0 libxkbcommon0 libfontconfig1 libfreetype6 libharfbuzz0b libfribidi0 libdbus-1-3 libasound2t64 libexpat1 zlib1g libgmp10 libcom-err2 libp11-kit0 libpipewire-0.3-0t64
      - name: Unzip and run
        shell: bash
        run: |
          set -x
          cd bundles
          find . -name '*.zip' -exec unzip -q -o {} \;
          ls
          ! ldd MDVault/MDVault | grep "not found"
          status=0; APPKITWIN_HOST_BACKEND=1 timeout 5 ./MDVault/MDVault || status=$?
          test "$status" = 124
          status=0; APPKITWIN_HOST_BACKEND=1 timeout 5 ./DailyTodo/DailyTodo || status=$?
          test "$status" = 124
          export XDG_DATA_HOME=$PWD/xdg
          status=0; APPKITWIN_HOST_BACKEND=1 APPKITWIN_CRASH_TEST=trap timeout 30 ./Dependent/Dependent || status=$?
          test "$status" != 0 && test "$status" != 124
          grep -l "Backtrace" xdg/Dependent/Crashes/*.txt

  windows-release:
    name: Windows release build, tests, bundles and crash report
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE
      # -j 1 everywhere, as in the debug job (docs/ci-windows-runner.md).
      # The debug-info flags are the ones the bundle plugin adds to a Windows release build
      # (a PDB for crash reports), so the plugin's builds below reuse this one.
      - name: Build (release)
        shell: bash
        run: swift build -c release -j 1 -Xswiftc -g -Xswiftc -debug-info-format=codeview -Xlinker -debug
      - name: A dependent package (Examples/Dependent) with a plain swift build
        shell: bash
        working-directory: Examples/Dependent
        run: swift build -j 1
      - name: Bundle the dependent package through the plugin it gets from AppKitCross
        shell: bash
        working-directory: Examples/Dependent
        run: swift package -j 1 --allow-writing-to-package-directory bundle --product Dependent -c release --zip
      - name: Bundle MDVault and DailyTodo
        shell: bash
        run: |
          swift package -j 1 --allow-writing-to-package-directory bundle --product MDVault -c release --zip
          swift package -j 1 --allow-writing-to-package-directory bundle --product DailyTodo -c release --zip
          ls -la .build/bundle .build/bundle/MDVault
      - name: The bundles run without the Swift runtime on PATH (and crash into a report)
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          $env:LOCALAPPDATA = "$PWD\localappdata"
          foreach ($app in @(".build\bundle\MDVault\MDVault.exe", ".build\bundle\DailyTodo\DailyTodo.exe")) {
            $p = Start-Process -FilePath $app -PassThru
            Start-Sleep -Seconds 8
            if ($p.HasExited) { Write-Error "$app exited with $($p.ExitCode) (a missing DLL is 0xC0000135 = -1073741515)"; exit 1 }
            Stop-Process -Id $p.Id -Force
            Write-Host "$app ran for 8 s"
          }
          # The reports directory appears with the first report, not at launch.
          if (Test-Path localappdata) { Get-ChildItem -Recurse localappdata | Format-Table FullName; Write-Error "a launch without a crash created a reports directory"; exit 1 }
          if (-not (Test-Path ".build\bundle\MDVault\MDVault.pdb")) { Write-Error "no PDB in the MDVault bundle"; exit 1 }
          $env:APPKITWIN_CRASH_TEST = "1"
          $p = Start-Process -FilePath "Examples\Dependent\.build\bundle\Dependent\Dependent.exe" -PassThru
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; Write-Error "the crash test did not end"; exit 1 }
          Write-Host "exit code $($p.ExitCode)"
          Get-ChildItem -Recurse localappdata | Format-Table FullName, Length
          $txt = Get-ChildItem localappdata\Dependent\Crashes\*.txt | Select-Object -First 1
          $dmp = Get-ChildItem localappdata\Dependent\Crashes\*.dmp | Select-Object -First 1
          Get-Content $txt.FullName -TotalCount 40
          if (-not $dmp -or $dmp.Length -lt 1000) { Write-Error "no minidump"; exit 1 }
          if (-not (Select-String -Path $txt.FullName -Pattern "EXCEPTION_ACCESS_VIOLATION" -Quiet)) { Write-Error "no exception in the report"; exit 1 }
          if (-not (Select-String -Path $txt.FullName -Pattern "ccrash_crash_now" -Quiet)) { Write-Error "the backtrace names no function (PDB missing or not found)"; exit 1 }
      # Last, since `swift test` rebuilds everything with testability (ADR-0046 has the
      # Swift 6.2 asserts-toolchain SIL deserializer crash this step found).
      - name: Tests in release on the host backend
        shell: bash
        run: swift test -c release -j 1
        env:
          APPKITWIN_HOST_BACKEND: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-windows
          path: |
            .build/bundle/*.zip
            Examples/Dependent/.build/bundle/*.zip
          retention-days: 14
