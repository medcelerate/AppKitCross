name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS host build and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test

  windows:
    name: Windows build
    # windows-latest ships VS 2026 (MSVC 14.5x), whose STL needs Clang 20; Swift 6.2's clang is older.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE
      - run: swift --version
      - run: swift build -c debug

  linux:
    name: Linux build (X11 + Wayland, Cairo)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends pkg-config libcairo2-dev libpango1.0-dev libx11-dev libwayland-dev libxkbcommon-dev
      - run: swift build
      - name: Tests on the host backend
        run: APPKITWIN_HOST_BACKEND=1 swift test
